<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Table</title>
    <style>
        table
        td,
        th,
        tr {
            border: 1px solid;
            border-collapse: collapse;
            padding: 5px
        }
        thead{
             background-color:rgb(189, 173, 237);
        }
    </style>
</head>
<body>
   <table>
    <thead>
        <tr>
            <th>EMP Code</th>
            <th>EMP Name</th>
            <th>Job Title</th>
            <th>Salary(Lpa)</th>

        </tr>
    </thead>
    <tbody>
        <tr>
            <td>911</td>
            <td>Alana</td>
            <td>Developer</td>
            <td>69.9</td>
        </tr>
        <tr>
            <td>912</td>
            <td>Daisy</td>
            <td>Digital Marketing</td>
            <td>91.2</td>
        </tr>
        <tr>
            <td>913</td>
            <td>Brad</td>
            <td>Tester</td>
            <td>9.2</td>
        </tr>
        <tr>
            <td>914</td>
            <td>Aditi</td>
            <td>HR</td>
            <td>12.8</td>
        </tr>
        <tr>
            <td>915</td>
            <td>Maria</td>
            <td>Developer</td>
            <td>24.8</td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td colspan="4">This Tha Table</td>
        </tr>
    </tfoot>
   </table> 
</body>
</html>
